name: Evals

# Runs the prompt sets in docs/use-case-comparison through a model against the Ask Righto tools and
# scores each answer mechanically: expected tools called, every figure traced to the prompt or a
# tool result (scripts/trace-numbers.mjs), banned wording flagged. By hand only: every run spends
# model tokens. See docs/evals.md.
#
# Needs no production database. It starts a throwaway PostgreSQL service, applies the migrations and
# loads what the repo and its test fixtures hold (VIC course index, VCE data, a sample CRICOS sheet,
# sample health cover files) and synthetic energy plans and benchmarks (scripts/evals/load-energy-fixtures.mjs).
# Home loan data needs live CDR payloads that this job does not load, so those prompts are not in the default
# sets; the energy set runs on invented fixture data only, so it checks behaviour and wording, not real prices.
#
# Configured only by repository settings (Settings > Secrets and variables > Actions), the same
# variables a local run reads:
#   variable EVALS_BASE_URL  OpenAI-compatible base URL
#   variable EVALS_MODEL     model id at that endpoint
#   secret   EVALS_API_KEY   the endpoint's key
#
# The report is shown on the run's summary page and uploaded with every answer as an artifact.

on:
  workflow_dispatch:
    inputs:
      set:
        description: 'Prompt sets, comma-separated: domestic, international, health, energy, home-loans, or "all"'
        required: false
        type: string
        default: 'domestic,international,health'
      only:
        description: 'Only these prompt ids, e.g. D01,H07 ("all" or empty for the whole sets)'
        required: false
        type: string
      repeat:
        description: 'Runs per prompt'
        required: true
        type: string
        default: '1'
      label:
        description: 'A label for this run, e.g. "before the skill change"'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: askrighto_evals
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/askrighto_evals
      DATABASE_SCHEMA: askrighto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the endpoint is configured
        env:
          EVALS_BASE_URL: ${{ vars.EVALS_BASE_URL }}
          EVALS_MODEL: ${{ vars.EVALS_MODEL }}
          EVALS_API_KEY: ${{ secrets.EVALS_API_KEY }}
        run: |
          missing=0
          [ -n "$EVALS_BASE_URL" ] || { echo "::error::Add the repository variable EVALS_BASE_URL (Settings > Secrets and variables > Actions > Variables)."; missing=1; }
          [ -n "$EVALS_MODEL" ] || { echo "::error::Add the repository variable EVALS_MODEL (Settings > Secrets and variables > Actions > Variables)."; missing=1; }
          [ -n "$EVALS_API_KEY" ] || { echo "::error::Add the repository secret EVALS_API_KEY (Settings > Secrets and variables > Actions > Secrets)."; missing=1; }
          exit $missing

      - name: Build
        run: npm run build

      # A failed load is a warning, not a stop: the prompts for that data then score against "not available".
      - name: Load the data the repo holds
        run: |
          node dist/askrighto.js migrate
          load() { echo "::group::$*"; node dist/askrighto.js "$@" || echo "::warning::'$*' failed; its prompts will see no data"; echo "::endgroup::"; }
          load courses:load --cricos test/fixtures/cricos/real-layout/courses.csv --course-locations test/fixtures/cricos/real-layout/course-locations.csv
          load intl:load --cricos test/fixtures/cricos/intl-sample.csv
          load health:load --dir test/fixtures/health --source-date 2026-11-03 --source-name "Test fixtures"
          echo "::group::energy fixtures"; node scripts/evals/load-energy-fixtures.mjs || echo "::warning::energy fixtures failed; the energy prompts will see less data"; echo "::endgroup::"

      - name: Run the evals
        env:
          EVALS_API_KEY: ${{ secrets.EVALS_API_KEY }}
          EVALS_BASE_URL: ${{ vars.EVALS_BASE_URL }}
          EVALS_MODEL: ${{ vars.EVALS_MODEL }}
          SETS: ${{ inputs.set }}
          ONLY: ${{ inputs.only }}
          REPEAT: ${{ inputs.repeat }}
          LABEL: ${{ inputs.label }}
        run: |
          ARGS=(--set "${SETS:-domestic,international,health}" --repeat "$REPEAT")
          if [ -n "$ONLY" ] && [ "$ONLY" != "all" ]; then ARGS+=(--only "$ONLY"); fi
          if [ -n "$LABEL" ]; then ARGS+=(--label "$LABEL"); fi
          node scripts/evals/run.mjs "${ARGS[@]}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-${{ github.run_id }}
          path: evals/runs/
          if-no-files-found: warn
          retention-days: 30
