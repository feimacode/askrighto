name: Image

# Builds the hosted-server image and pushes it to GHCR:
#   push to main → ghcr.io/feimacode/askrighto:latest and :sha-<short sha>
#   versioned images (:1.2.3, :stable) are built by release.yml
#   manual run   → :sha-<short sha>
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/feimacode/askrighto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Ask Righto
            org.opencontainers.image.description=Hosted MCP server for Australian everyday decisions from public data
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the pushed image (no database, liveness must work and readiness must say why not)
        run: |
          ref="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          docker run -d --name askrighto -p 8080:8080 "$ref"
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/healthz
          curl -s -o /dev/null -w "readyz without data: %{http_code}\n" localhost:8080/readyz
