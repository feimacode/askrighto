lhc:
  - id: lhc
    status: in_force
    effectiveFrom: 2000-07-01
    percentPerYearOver: 2
    startAge: 30
    capPercent: 70
    yearsToRemove: 10
    source:
      url: https://www.ato.gov.au/individuals-and-families/medicare-and-private-health-insurance/private-health-insurance-rebate/lifetime-health-cover
      pageUpdatedOn: 2026-05-05
      readOn: 2026-11-17
    note: The base day is usually the 1 July after the 31st birthday and can change, for example when overseas on that date. The ATO page was read in summary only.
    reviewBy: 2027-07-01
