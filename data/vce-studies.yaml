# Concept groups used in course prerequisites. These are the universities' own phrasing (for example
# "English (any)"), not VTAC's study area groupings.
groups:
  - id: english-group
    name: "English (any of English, EAL, Literature, English Language)"
    members: [english, english-as-an-additional-language, literature, english-language]
  - id: english-not-eal
    name: "English other than EAL (English, Literature or English Language)"
    members: [english, literature, english-language]
  - id: any-mathematics
    name: "Mathematics (any of Foundation, General, Methods, Specialist)"
    members: [foundation-mathematics, general-mathematics, mathematical-methods, specialist-mathematics]
  - id: any-science
    name: "A science (Biology, Chemistry, Physics, Psychology, Environmental Science)"
    members: [biology, chemistry, physics, psychology, environmental-science]
